<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a0f22"><title>Juegos · Jóvenes de Fuego</title><link rel="icon" href="icon-512.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#f6eef8;--mut:#b9a6d8;--acc:#ff7a3d;--yel:#ffe81a;--ok:#22c55e;--bad:#ef4444;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#5a1a07 0,transparent 45%),radial-gradient(circle at 90% 100%,#3b1160 0,transparent 50%),#120c14;background-attachment:fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top a,.top button{background:var(--glass);border:1px solid var(--bd);color:var(--ink);border-radius:14px;padding:9px 13px;text-decoration:none;font:inherit;cursor:pointer;backdrop-filter:blur(10px)}
h1{margin:0;font-size:24px;flex:1;background:linear-gradient(90deg,var(--yel),var(--acc),#ff3d6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35);animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.menu{display:grid;gap:12px}
.g{display:flex;gap:14px;align-items:center;text-align:left;width:100%;color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s}
.g:active{transform:scale(.97)}
.g .e{font-size:34px;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 33%,transparent),#8a1fd055)}
.g b{display:block;font-size:18px}.g small{color:var(--mut)}.g em{margin-left:auto;font-style:normal;color:var(--yel);font-size:13px;white-space:nowrap}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mut);font-size:14px}
.pill{background:var(--glass);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;color:var(--ink)}
.prog{height:6px;border-radius:9px;background:var(--glass);overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),var(--acc));transition:width .3s}
.q{font-size:20px;font-weight:700;margin:6px 0 16px}
.o{display:block;width:100%;margin-bottom:10px;padding:14px;border-radius:16px;border:1px solid var(--bd);background:var(--glass);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:.15s}
.o:active{transform:scale(.98)}.o.ok{background:#22c55e33;border-color:var(--ok);animation:pop .35s}.o.no{background:#ef444433;border-color:var(--bad);animation:shake .35s}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{background:linear-gradient(135deg,var(--acc),var(--p2));border:0;color:#fff;font:700 16px system-ui;padding:14px 20px;border-radius:16px;cursor:pointer;width:100%;margin-top:6px}
.big{font-size:54px;text-align:center}.c{text-align:center}.mut{color:var(--mut)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.m{aspect-ratio:1;border-radius:16px;border:1px solid var(--bd);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 20%,transparent),#8a1fd033);font-size:28px;display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .25s}
.m.up{background:var(--glass);transform:rotateY(180deg) scaleX(-1)}.m.dn{background:#22c55e33;border-color:var(--ok)}
.m span{font-size:12px;padding:3px;text-align:center;line-height:1.1}
</style><link rel="stylesheet" href="paletas.css"><link rel="stylesheet" href="base.css"><script src="paleta.js"></script>
<script>(function(){var h=document.documentElement,t='light';try{t=JSON.parse(localStorage.getItem('jf-pref')||'{}').theme||'light'}catch(e){}var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);h.dataset.ui=d?'dark':'light';h.dataset.theme=d?'dark':'light';h.classList.add('pub');if(/juegos/.test(location.pathname))h.classList.add('jg');if(/[?&]tv=1/.test(location.search)){h.dataset.ui='dark';h.dataset.theme='dark'}})()</script><link rel="stylesheet" href="nuevo.css"><script src="nuevo.js" defer></script></head><body><main><div class="top"><a href="ranking.html" id="back">←</a><h1 id="ttl">🎮 Juegos</h1><button id="snd">🔊</button></div><div id="v"></div></main>
<script src="preguntas.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import * as CFG from './firebase-config.js';
let FS=null,ME=null,PD={};
try{const nm=localStorage.getItem('jf-me');if(nm&&!String(CFG.firebaseConfig.apiKey).startsWith('PEGA')){FS=getFirestore(initializeApp(CFG.firebaseConfig));
 await Promise.race([(async()=>{const r=await getDoc(doc(FS,'public','ranking')),x=((r.exists()?r.data().all:[])||[]).find(z=>z.n===nm);if(x&&x.i){ME=x.i;const p=await getDoc(doc(FS,'photos',ME));PD=p.exists()?p.data():{}}})(),new Promise(r=>setTimeout(r,5000))])}}catch(e){}
async function award(pts){if(!ME||!FS)return 0;const day=new Date().toISOString().slice(0,10);let st={};try{st=JSON.parse(localStorage.getItem('jf_day')||'{}')}catch(e){}if(st.d!==day)st={d:day,n:0,f:0};
 let g=Math.max(1,Math.floor(pts/8))+(st.f?0:5);g=Math.min(g,Math.max(0,150-st.n));if(g<=0)return 0;
 try{const c=(await getDoc(doc(FS,'photos',ME))).data()||{},d={p:c.p||'',f:c.f||'',a:c.a||'',b:c.b||'',t:c.t||'',u:c.u||[],w:(c.w||0)+g,c:Date.now()};await setDoc(doc(FS,'photos',ME),d);PD=d;st.n+=g;st.f=1;try{localStorage.setItem('jf_day',JSON.stringify(st))}catch(e){}return g}catch(e){return 0}}
const showG=g=>{const c=document.querySelector('#v .card');if(g&&c)c.insertAdjacentHTML('afterbegin',`<div class="pill" style="display:inline-block;margin-bottom:10px;background:color-mix(in srgb,var(--acc) 20%,transparent);border-color:var(--acc)">+${g} 🔥 Llamas ganadas</div>`)};
const $=s=>document.querySelector(s),v=$('#v'),sh=a=>[...a].sort(()=>Math.random()-.5);
let mute=false,AC;const beep=(f,d=.12)=>{if(mute)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}},vib=n=>navigator.vibrate&&navigator.vibrate(n);
$('#snd').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇':'🔊'};
const best=k=>+localStorage.getItem('jf_'+k)||0,setBest=(k,n)=>{try{if(n>best(k))localStorage.setItem('jf_'+k,n)}catch(e){}};
// [pregunta, correcta, [incorrectas], categoría]
const Q=[["¿Quién construyó el arca?","Noé",["Moisés","Abraham","David"],"AT"],["¿Cuántos días y noches llovió en el diluvio?","40",["7","12","100"],"AT"],["¿Quién fue lanzado al foso de los leones?","Daniel",["José","Elías","Jonás"],"AT"],["¿Quién derrotó a Goliat?","David",["Saúl","Sansón","Josué"],"AT"],["¿Qué mar abrió Dios para Moisés?","Mar Rojo",["Mar Muerto","Mar de Galilea","Mediterráneo"],"AT"],["¿Quién fue vendido por sus hermanos?","José",["Benjamín","Isaac","Jacob"],"AT"],["¿Qué profeta fue tragado por un gran pez?","Jonás",["Elías","Eliseo","Isaías"],"AT"],["¿Quién tenía una fuerza enorme en su cabello?","Sansón",["Gedeón","Josué","Caleb"],"AT"],["¿Cuál es el primer libro de la Biblia?","Génesis",["Éxodo","Salmos","Mateo"],"AT"],["¿Quién fue el hombre más sabio, hijo de David?","Salomón",["Absalón","Jonatán","Samuel"],"AT"],["¿Qué muralla cayó tras rodearla siete días?","Jericó",["Babilonia","Nínive","Jerusalén"],"AT"],["¿Quién subió al cielo en un carro de fuego?","Elías",["Enoc","Moisés","Eliseo"],"AT"],
["¿En qué ciudad nació Jesús?","Belén",["Nazaret","Jerusalén","Capernaúm"],"NT"],["¿Cuántos discípulos eligió Jesús?","12",["7","10","70"],"NT"],["¿Quién bautizó a Jesús?","Juan el Bautista",["Pedro","Pablo","Andrés"],"NT"],["¿Quién negó a Jesús tres veces?","Pedro",["Judas","Tomás","Juan"],"NT"],["¿Qué discípulo dudó hasta ver las heridas de Jesús?","Tomás",["Felipe","Mateo","Santiago"],"NT"],["¿Quién escribió muchas cartas a las iglesias y antes se llamaba Saulo?","Pablo",["Pedro","Timoteo","Bernabé"],"NT"],["¿Cuál es el último libro de la Biblia?","Apocalipsis",["Hechos","Judas","Romanos"],"NT"],["¿Qué convirtió Jesús en vino en Caná?","Agua",["Leche","Aceite","Pan"],"NT"],["¿Cuántos panes y peces usó Jesús para alimentar a 5000?","5 panes y 2 peces",["7 panes y 3 peces","3 panes y 5 peces","12 panes"],"NT"],["¿Quién era el cobrador de impuestos que subió a un sicómoro?","Zaqueo",["Mateo","Nicodemo","Lázaro"],"NT"],["¿A quién resucitó Jesús después de 4 días en la tumba?","Lázaro",["Jairo","Bartimeo","Tabita"],"NT"],["¿Qué Espíritu descendió en Pentecostés como lenguas de fuego?","Espíritu Santo",["Un ángel","La nube","El maná"],"NT"],
["¿Cuántos libros tiene la Biblia?","66",["39","27","72"],"General"],["¿Cuántos libros tiene el Nuevo Testamento?","27",["39","66","12"],"General"],["¿Cuál es el libro más largo de la Biblia?","Salmos",["Isaías","Génesis","Proverbios"],"General"],["Los frutos del Espíritu están en…","Gálatas",["Efesios","Romanos","Santiago"],"General"],["¿Dónde está el Padrenuestro?","Mateo 6",["Juan 3","Salmo 23","Hechos 2"],"General"],["¿Qué cuatro libros narran la vida de Jesús?","Los Evangelios",["Las Epístolas","Los Profetas","La Ley"],"General"]];
// versículos: [texto con __, palabra, [distractores], cita]
const V=[["Jehová es mi __, nada me faltará.","pastor",["rey","escudo","juez"],"Salmo 23:1"],["Todo lo puedo en __ que me fortalece.","Cristo",["mí","la fe","oración"],"Filipenses 4:13"],["De tal manera amó Dios al __, que ha dado a su Hijo unigénito.","mundo",["pueblo","hombre","cielo"],"Juan 3:16"],["Mira que te mando que te __ y seas valiente.","esfuerces",["calles","vayas","humilles"],"Josué 1:9"],["Confía en Jehová con todo tu __.","corazón",["ser","tiempo","esfuerzo"],"Proverbios 3:5"],["Sé ejemplo de los creyentes en palabra, conducta, amor, espíritu, fe y __.","pureza",["fuerza","gozo","paz"],"1 Timoteo 4:12"],["La palabra es lumbrera a mis pies, y __ a mi camino.","luz",["guía","paz","senda"],"Salmo 119:105"],["Jesús dijo: Yo soy el camino, y la verdad, y la __.","vida",["luz","paz","puerta"],"Juan 14:6"],["Dios es nuestro amparo y __, nuestro pronto auxilio en las tribulaciones.","fortaleza",["escudo","roca","torre"],"Salmo 46:1"],["Pedid, y se os dará; buscad, y __.","hallaréis",["veréis","tendréis","iréis"],"Mateo 7:7"]];
try{Q.push(...EXTRA_Q);V.push(...EXTRA_V)}catch(e){}
function pick(key,bank,n){let seen=[];try{seen=JSON.parse(localStorage.getItem("jf_seen_"+key)||"[]")}catch(e){}let f=bank.filter(x=>!seen.includes(x[0]));if(f.length<n){seen=[];f=bank}const r=sh(f).slice(0,n);try{localStorage.setItem("jf_seen_"+key,JSON.stringify(seen.concat(r.map(x=>x[0]))))}catch(e){}return r}
const ICO=[["🕊️","Paloma"],["🕯️","Luz"],["✝️","Cruz"],["👑","Corona"],["🍷","Copa"],["🔥","Fuego"],["📖","Biblia"],["⛰️","Monte"]];
const menu=()=>{$('#ttl').textContent='🎮 Juegos';$('#back').href='ranking.html';$('#back').onclick=null;
v.innerHTML=`${ME?`<div class="card c" style="margin-bottom:12px"><b style="font-size:22px;color:var(--yel)">🔥 ${PD.w||0} Llamas</b><div class="mut">Gana Llamas jugando y cámbialas por marcos, avatares y más en <a href="mi.html" style="color:var(--acc)">Mi progreso</a>.</div></div>`:`<div class="card c" style="margin-bottom:12px"><b>🔥 Gana Llamas</b><div class="mut">Entra a <a href="mi.html" style="color:var(--acc)">Mi progreso</a>, elige tu nombre y vuelve para guardar tus Llamas.</div></div>`}<div class="menu">`+[["quiz","🧠","Trivia bíblica","10 preguntas con tiempo",'q'],["ver","📜","Completa el versículo","Elige la palabra que falta",'v'],["mem","🃏","Memoria","Encuentra las parejas",'m']].map(g=>`<button class="card g" data-g="${g[4]}"><span class="e">${g[1]}</span><span><b>${g[2]}</b><small>${g[3]}</small></span><em>🏆 ${best(g[0])}</em></button>`).join('')+`</div>`;
v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>({q:()=>quiz('quiz',Q,10,15),v:()=>quiz('ver',V,10,20),m:mem})[b.dataset.g]());
const bk=$('#back');bk.href='#';bk.onclick=null;bk.href='ranking.html'};
function quiz(key,bank,n,secs){const cat=key==='quiz'&&!arguments[4];const qs=pick(key,bank,n);let i=0,pts=0,st=0,t,tm;
const back=$('#back');back.href='#';back.onclick=e=>{e.preventDefault();clearInterval(tm);menu()};
const show=()=>{if(i>=qs.length)return end();const x=qs[i],isV=key==='ver',txt=isV?x[0].replace('__','_____'):x[0],ans=x[1],opts=sh([ans,...x[2]]);t=secs;
v.innerHTML=`<div class="hud"><span class="pill">${i+1}/${qs.length}</span><span class="pill" id="tt">⏱ ${t}</span><span class="pill">⭐ ${pts}</span>${st>1?`<span class="pill">🔥 x${st}</span>`:''}</div><div class="prog"><i style="width:${i/qs.length*100}%"></i></div><div class="card"><div class="q">${txt}</div>${opts.map(o=>`<button class="o">${o}</button>`).join('')}</div>`;
const done=(pick,btn)=>{clearInterval(tm);const ok=pick===ans;v.querySelectorAll('.o').forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add('ok')});
if(ok){st++;pts+=10+Math.min(st-1,5)*2+Math.ceil(t/3);beep(880);vib(30)}else{st=0;btn&&btn.classList.add('no');beep(200,.3);vib([60,40,60])}
const c=v.querySelector('.card');if(isV)c.insertAdjacentHTML('beforeend',`<p class="mut c">📖 ${x[3]}</p>`);c.insertAdjacentHTML('beforeend',`<button class="btn" id="nx">${i+1<qs.length?'Siguiente →':'Ver resultado'}</button>`);$('#nx').onclick=()=>{i++;show()}};
v.querySelectorAll('.o').forEach(b=>b.onclick=()=>done(b.textContent,b));
tm=setInterval(()=>{t--;const e=$('#tt');if(e)e.textContent='⏱ '+t;if(t<=0)done(null)},1000)};
const end=()=>{setBest(key,pts);award(pts).then(showG);const m=pts>=qs.length*14?['🏆','¡Eres un campeón de la Palabra!']:pts>=qs.length*8?['🔥','¡Muy bien, sigue así!']:['📖','¡Sigue estudiando, tú puedes!'];
v.innerHTML=`<div class="card c"><div class="big">${m[0]}</div><h2>${m[1]}</h2><p class="mut">Puntos</p><div style="font-size:48px;font-weight:800;color:var(--yel)">${pts}</div><p class="mut">Récord: ${best(key)}</p><button class="btn" id="ag">Jugar otra vez</button><button class="btn" id="mn" style="background:var(--glass);border:1px solid var(--bd)">Menú</button></div>`;$('#ag').onclick=()=>quiz(key,bank,n,secs);$('#mn').onclick=menu;if(pts>=qs.length*14)beep(1040,.4)};show()}
function mem(){const back=$('#back');back.href='#';back.onclick=e=>{e.preventDefault();menu()};const cards=sh([...ICO,...ICO]);let sel=[],mv=0,ok=0,lock=false;
v.innerHTML=`<div class="hud"><span class="pill" id="mv">Movimientos: 0</span><span class="pill">🏆 ${best('mem')?'Mejor: '+best('mem'):'—'}</span></div><div class="card"><div class="mem">${cards.map((c,k)=>`<button class="m" data-k="${k}">❓</button>`).join('')}</div></div>`;
v.querySelectorAll('.m').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(lock||b.classList.contains('up')||b.classList.contains('dn'))return;b.classList.add('up');b.innerHTML=`<span style="font-size:30px">${cards[k][0]}</span>`;beep(520,.06);sel.push(b);
if(sel.length===2){mv++;$('#mv').textContent='Movimientos: '+mv;const[a,c]=sel;if(cards[+a.dataset.k][1]===cards[+c.dataset.k][1]){[a,c].forEach(x=>{x.classList.remove('up');x.classList.add('dn')});ok++;beep(880);vib(30);sel=[];if(ok===ICO.length)setTimeout(()=>{const sc=Math.max(1,100-mv*3);setBest('mem',sc);award(sc).then(showG);v.innerHTML=`<div class="card c"><div class="big">🎉</div><h2>¡Lo lograste en ${mv} movimientos!</h2><p class="mut">Puntaje: ${sc}</p><button class="btn" id="ag">Jugar otra vez</button><button class="btn" id="mn" style="background:var(--glass);border:1px solid var(--bd)">Menú</button></div>`;$('#ag').onclick=mem;$('#mn').onclick=menu},500)}
else{lock=true;setTimeout(()=>{[a,c].forEach(x=>{x.classList.remove('up');x.textContent='❓'});sel=[];lock=false},800)}}})}
menu();
</script></body></html>
