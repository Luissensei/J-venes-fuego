function parseCSV(tx){tx=tx.replace(/^\uFEFF/,'');const dl=[';',',','\t'].map(d=>[d,tx.split('\n')[0].split(d).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[];let row=[],cur='',q=false;

 let body=rows;if(cn>=0)body=rows.slice(1);else{cn=0;cp=1;cb=cap=ca=cbr=-1}
